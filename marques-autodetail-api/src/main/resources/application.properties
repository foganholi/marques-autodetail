spring.application.name=marques-autodetail-api
server.port=${PORT:8080}
server.servlet.context-path=/api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/marques_autodetail}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jackson.time-zone=America/Sao_Paulo
app.jwt.secret=${JWT_SECRET:MarquesAutoDetailSecretKeyForJwtGenerationChangeInProduction2026}
app.jwt.expiration-ms=86400000
